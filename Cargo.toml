[workspace]
members = ["crates/*"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1.5"
libc = "0.2"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
async-channel = "2.5"
[profile.release]
lto = "thin"
strip = true
