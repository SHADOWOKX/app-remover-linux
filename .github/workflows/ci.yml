name: Safety and native build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4 — pinned to an immutable commit SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # dtolnay/rust-toolchain stable — pinned to an immutable commit SHA.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
